# Bumped to current stable as of 2026-10-24 (see CLAUDE.md). libsodium-bindings stays pinned to
# the version verified to build for jvm+android (core/CLAUDE.md "verify before enabling a target").
# No bip39 entry: no maintained pure-Kotlin KMP BIP39 library found: commonMain implements §2.1
# (wordlist + checksum) directly instead of adding a dependency. No serialization-cbor entry:
# kotlinx-serialization-cbor does not produce RFC 8949 §4.2.1 deterministic output (indefinite-length
# collections, no canonical map-key sort) - see encoding/CanonicalCbor.kt for the hand-written encoder.
[versions]
kotlin = "2.4.21"
agp = "9.4.1"
coroutines = "1.11.0"
serialization = "1.12.0"
ktor = "3.6.0"
sqldelight = "2.4.1"
libsodium-bindings = "0.9.5"
kotest = "6.2.6"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
libsodium = { module = "com.ionspin.kotlin:multiplatform-crypto-libsodium-bindings", version.ref = "libsodium-bindings" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# AGP 9 dropped com.android.library + kotlin.multiplatform together; KMP android targets now use
# this dedicated plugin (android{} block moves inside kotlin{}). See core/build.gradle.kts.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
